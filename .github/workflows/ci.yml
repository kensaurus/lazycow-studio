# The studio's tests on every pull request and on main: npm test (layout, copy, server, helper) and pytest (the
# Python pipeline), each on Linux, Windows and macOS (Apple silicon), the three systems the setup supports. No secrets:
# the tests use a throwaway data folder, fake network replies and no paid service.
# Each system gets ffmpeg the way a person there would (apt on Linux; on Windows and macOS the build the double-click
# setup downloads, pinned in scripts/bootstrap/versions.json and checked against its SHA-256) and the same
# locked Python packages the setup installs (py/requirements-<system>.lock, checked against their hashes).
#
# Windows and macOS legs: every run in the public repository (its Actions minutes are free). In a private copy
# they bill (Windows ~2x, macOS ~10x Linux), so there they run only with release intent: a manual run
# (workflow_dispatch), a v* tag, or a pull request from a release/* branch. Pushes and other pull requests run
# Linux only, on vars.LINUX_RUNNER when the repository sets one, else GitHub's Ubuntu 24.04.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: npm test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: that label moves to 26.04 in November 2026 (actions/runner-images#14748).
        # All three systems in the public repository or with release intent (see the top of this file); else Linux.
        os: ${{ fromJSON((!github.event.repository.private || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/')) && '["ubuntu-24.04","windows-latest","macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && ((github.actor != 'dependabot[bot]' && vars.LINUX_RUNNER) || 'ubuntu-24.04') || matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  python:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The same systems as the node job. macos-15 is Apple silicon, 7 GB RAM. The lock file and torch backend
        # follow runner.os in the "Python packages" step: a matrix `include` for a system left out of `os` would
        # add that system back as a job of its own.
        os: ${{ fromJSON((!github.event.repository.private || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.head_ref, 'release/')) && '["ubuntu-24.04","windows-latest","macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && ((github.actor != 'dependabot[bot]' && vars.LINUX_RUNNER) || 'ubuntu-24.04') || matrix.os }}
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-managed   # the same standalone Python 3.13 the setup installs, not the runner's own
    defaults:
      run:
        shell: bash
        working-directory: py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.5"   # scripts/bootstrap/versions.json
          python-version: "3.13"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: py/requirements-*.lock

      - name: ffmpeg and libsndfile (apt; Ubuntu 24.04 gives ffmpeg 6.1)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg libsndfile1
      # Not Homebrew: its ffmpeg is built without libzimg, so no zscale, and the HDR camera format cannot render
      # (test_formats). The Mac setup (mac.sh) installs this build, which has it.
      - name: ffmpeg (the pinned, SHA-256-checked build the Mac setup downloads)
        if: runner.os == 'macOS'
        run: |
          bin="$RUNNER_TEMP/ffmpeg-bin"; mkdir -p "$bin"
          for t in ffmpeg ffprobe; do
            read -r url sha < <(node -p "const f=require('../scripts/bootstrap/versions.json').ffmpeg['darwin-arm64']['$t']; [f.url, f.sha256].join(' ')")
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$t.zip" "$url"
            echo "$sha  $RUNNER_TEMP/$t.zip" | shasum -a 256 -c -
            unzip -o -q "$RUNNER_TEMP/$t.zip" -d "$bin"; chmod +x "$bin/$t"
          done
          echo "$bin" >> "$GITHUB_PATH"
      - name: ffmpeg (the pinned, SHA-256-checked build the Windows setup downloads)
        if: runner.os == 'Windows'
        run: |
          read -r url sha dir < <(node -p "const f=require('../scripts/bootstrap/versions.json').ffmpeg['win-x64']; [f.url, f.sha256, f.dir].join(' ')")
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSL --retry 3 -o "$tmp/ffmpeg.zip" "$url"
          echo "$sha  $tmp/ffmpeg.zip" | sha256sum -c -
          7z x -y -bd -o"$tmp" "$tmp/ffmpeg.zip" > /dev/null
          bin="$(cygpath -w "$tmp/$dir/bin")"
          echo "$bin" >> "$GITHUB_PATH"
          echo "STUDIO_TOOLS=$bin" >> "$GITHUB_ENV"
      - name: Which ffmpeg
        run: |
          ffmpeg -hide_banner -version | sed -n 1p
          ffprobe -hide_banner -version | sed -n 1p

      - name: Python packages (the setup's lock, checked against its hashes)
        env:
          LOCK: requirements-${{ runner.os == 'Windows' && 'win' || runner.os == 'macOS' && 'mac' || 'linux' }}.lock
          TORCH: ${{ runner.os != 'macOS' && '--torch-backend cpu' || '' }}
        run: |
          uv pip sync $TORCH --require-hashes "$LOCK"
          uv pip install "pytest>=8.0"
      - run: python -m pytest -q

  # The branch protection on the public repository requires checks named "npm test" and "pytest". With the OS matrix
  # the jobs are named per system, so these two report one result each: green only when every system that ran passed.
  node-all:
    name: npm test
    needs: node
    if: ${{ always() }}
    runs-on: ${{ (github.actor != 'dependabot[bot]' && vars.LINUX_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.node.result }}" = "success"
  python-all:
    name: pytest
    needs: python
    if: ${{ always() }}
    runs-on: ${{ (github.actor != 'dependabot[bot]' && vars.LINUX_RUNNER) || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.python.result }}" = "success"
