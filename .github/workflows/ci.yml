# The studio's tests on every pull request and on main: npm test (layout, copy, server, helper) and pytest (the
# Python pipeline). No secrets: the tests use a throwaway data folder, fake network replies and no paid service.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  python:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: py
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: py/requirements.txt
      - name: ffmpeg and libsndfile
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg libsndfile1
      # requirements.txt only: the search model (torch, open_clip) is imported lazily and no test needs it.
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
