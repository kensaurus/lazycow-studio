# FILE: .github/workflows/release.yml
# PURPOSE: When a GitHub release is published, publish the `lazycow` npm package with provenance and list it in the
#          official MCP Registry (io.github.kensaurus/lazycow).
# NOTES: npm trusted publishing (OIDC): no npm token is stored. The package's npm settings must name this repository and
#        this workflow file as its trusted publisher (npmjs.com > lazycow > Settings). The first version is published by
#        hand (docs/release-checklist.md). The release must carry Lazycow-Studio-<version>.zip, whose SHA-256 is baked
#        into the package (scripts/build-packages.mjs --check fails otherwise).
name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # npm provenance + trusted publishing, and the MCP Registry's GitHub OIDC login
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The package is in step with this release
        run: |
          node scripts/build-packages.mjs --check
          node --test test/lazycow-package.test.mjs
      - name: The release zip is the one the package expects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          gh release download "v$v" -p "Lazycow-Studio-$v.zip" -D /tmp/rel
          want=$(node -p "require('./packages/lazycow/lib/release.json').sha256")
          got=$(sha256sum "/tmp/rel/Lazycow-Studio-$v.zip" | cut -d' ' -f1)
          test "$want" = "$got" || { echo "release zip SHA-256 $got, package expects $want"; exit 1; }
      - name: Publish to npm
        id: npm_publish
        working-directory: packages/lazycow
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "lazycow@$v" version >/dev/null 2>&1; then echo "lazycow@$v is already on npm"; else npm publish --provenance --access public; fi
      - name: List in the MCP Registry
        working-directory: packages/lazycow
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          # The registry checks npm, which can take minutes to show a new version (0.18.0 failed here once). Log in only
          # after npm shows it: the registry token lasts about 5 minutes and 0.23.1 failed with it expired.
          v=$(node -p "require('./package.json').version")
          for i in $(seq 1 60); do npm view "lazycow@$v" version >/dev/null 2>&1 && break; sleep 10; done
          npm view "lazycow@$v" version >/dev/null 2>&1 || { echo "npm does not show lazycow@$v after 10 minutes; run this workflow again later"; exit 1; }
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # A published release → #releases, a failed one → #alerts: a Mushi Mushi Ops event when MUSHI_OPS_KEY is set;
      # otherwise, or when Mushi Mushi does not take it, the Slack webhooks as before. Posts only from the public
      # repository (kensaurus/lazycow-studio), where npm trusted publishing lives; the private source repository carries
      # the same file through the public export and stays quiet. Skips when no secret is set, never fails the release,
      # never echoes a secret.
      - name: Tell Mushi Mushi how the release went
        if: ${{ !cancelled() && github.repository == 'kensaurus/lazycow-studio' }}
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          MUSHI_OPS_KEY: ${{ secrets.MUSHI_OPS_KEY }}
          MUSHI_API_URL: ${{ vars.MUSHI_API_URL || 'https://dxptnwrhwsqckaftyymj.supabase.co/functions/v1/api' }}
          SLACK_RELEASES_URL: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
          SLACK_ALERTS_URL: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          APP_NAME: Lazycow Studio
          VERSION: ${{ github.event.release.tag_name }}
          # True only when the npm publish step never ran: npm still has the previous version.
          FAIL_NOTE: ${{ steps.npm_publish.outcome == 'skipped' && 'Nothing was published; npm still has the previous version.' || '' }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export SUBJECT="$(git log -1 --format=%s 2>/dev/null | cut -c1-100)"
          export SHORT_SHA="${GITHUB_SHA::7}"
          if [ -n "$MUSHI_OPS_KEY" ]; then
            node -e '
              const e = process.env;
              const ok = e.JOB_STATUS === "success";
              const ver = e.VERSION || e.SHORT_SHA;
              const repo = e.GITHUB_REPOSITORY;
              const facts = [["Registry", "npm and the MCP Registry"], ["Workflow", e.WORKFLOW_NAME], ["Commit", e.SHORT_SHA]]
                .filter(([, v]) => v).map(([label, v]) => ({ label, value: String(v).slice(0, 200) }));
              const ev = ok
                ? { category: "releases", severity: "info", kind: "deploy.succeeded", title: `${ver} is out on npm and the MCP Registry` }
                : { category: "alerts", severity: "urgent", kind: "deploy.failed", title: `Release failed (${ver})`, thread_key: `deploy:${repo}:production` };
              const body = ok ? e.SUBJECT : (e.FAIL_NOTE || "Open the run to see which step failed.");
              if (body) ev.body = body.slice(0, 600);
              ev.title = ev.title.slice(0, 150);
              ev.facts = facts;
              ev.url = e.RUN_URL;
              ev.dedupe_key = `gh-run:${repo}:${e.GITHUB_RUN_ID}:${e.GITHUB_RUN_ATTEMPT}:${e.GITHUB_JOB}`;
              process.stdout.write(JSON.stringify(ev));
            ' > "$RUNNER_TEMP/ops.json"
            code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
              -H "X-Mushi-Api-Key: $MUSHI_OPS_KEY" -H 'Content-Type: application/json' \
              --data @"$RUNNER_TEMP/ops.json" "${MUSHI_API_URL%/}/v1/ops/events?forceFunctionRegion=ap-northeast-1" || true)
            case "$code" in
              200|202) echo "Mushi Mushi took the event ($code)"; exit 0 ;;
              422)
                # The commit subject is the only free text; send the notice once more without it.
                node -e 'const f=process.argv[1];const ev=JSON.parse(require("fs").readFileSync(f,"utf8"));delete ev.body;require("fs").writeFileSync(f,JSON.stringify(ev))' "$RUNNER_TEMP/ops.json"
                code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
                  -H "X-Mushi-Api-Key: $MUSHI_OPS_KEY" -H 'Content-Type: application/json' \
                  --data @"$RUNNER_TEMP/ops.json" "${MUSHI_API_URL%/}/v1/ops/events?forceFunctionRegion=ap-northeast-1" || true)
                echo "Mushi Mushi refused the commit subject as personal data; resent without it ($code)"; exit 0 ;;
            esac
            echo "Mushi Mushi answered ${code:-nothing}; using the Slack webhook instead"
          fi
          if [ "$JOB_STATUS" = "success" ]; then SLACK_URL="$SLACK_RELEASES_URL"; else SLACK_URL="$SLACK_ALERTS_URL"; fi
          [ -n "$SLACK_URL" ] || exit 0
          export SLACK_URL
          node -e '
            const e = process.env;
            let host = "";
            try { host = new URL(e.SLACK_URL).hostname; } catch {}
            if (host !== "hooks.slack.com") { console.error("Slack webhook is not a hooks.slack.com URL; skipped"); process.exit(1); }
            const esc = (s) => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const ok = e.JOB_STATUS === "success";
            const ver = e.VERSION || e.SHORT_SHA;
            const headline = ok ? `🚀 ${ver} is out on npm and the MCP Registry` : "🔴 Release failed";
            const detail = ok ? esc(e.SUBJECT) : (e.FAIL_NOTE || "Open the run to see which step failed.");
            const facts = ok ? `production · ${esc(e.WORKFLOW_NAME)}` : `production · ${esc(e.WORKFLOW_NAME)} · ${esc(ver)}`;
            const blocks = [
              { type: "section", text: { type: "mrkdwn", text: `*${esc(e.APP_NAME)}* · ${headline}` + (detail ? `\n${detail}` : "") } },
              { type: "context", elements: [{ type: "mrkdwn", text: facts }] },
              { type: "actions", elements: [{ type: "button", text: { type: "plain_text", text: "Open the run" }, url: e.RUN_URL }] }
            ];
            process.stdout.write(JSON.stringify({ text: `${e.APP_NAME} · ${headline}`, attachments: [{ color: ok ? "#2eb67d" : "#e01e5a", blocks }] }));
          ' > "$RUNNER_TEMP/slack.json" || exit 0
          curl -fsS --max-time 10 -o /dev/null -H 'Content-Type: application/json' --data @"$RUNNER_TEMP/slack.json" "$SLACK_URL"
